<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <i class="fa-brands fa-youtube"></i>
    <font face="Playbill" size="7" color="red"> I am font tag </font>
    <font color="purple" size="7">

      <i class="fa-brands fa-apple fa-pulse"></i>
      <i class="fa-brands fa-square-bluesky fa-beat"></i>
      <i class="fa-solid fa-triangle-exclamation fa-fade"></i>
      <i class="fa-brands fa-youtube fa-beat-fade"></i>
      <i class="fa-solid fa-volleyball fa-bounce"></i>
      <i class="fa-solid fa-mobile-vibrate fa-buzz"></i>

      <i class="fa-solid fa-camera-rotate fa-flip-360"></i>
      <i class="fa-solid fa-ghost fa-float"></i>
    </font>

    <font size="7" color="skyblue">
      <i class="fa-solid fa-droplet fa-jello"></i>
      <i class="fa-solid fa-bell fa-shake"></i>
      <i class="fa-solid fa-cog fa-spin-snap-8 fa-spin-reverse"></i>

      <i class="fa-solid fa-key fa-swing"></i>
