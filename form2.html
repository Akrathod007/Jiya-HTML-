<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action=""> 
        <label for="">First Name : </label>
        <!-- <input type="text" value="Ram" disabled> -->
        <input type="text" value="Ram" readonly>
        <br><br>
        <label for="">Hobbies : </label> 
        <input type="checkbox" name="hobbies" checked value="traveling">Traveling 
        <input type="checkbox" name="hobbies" value="reading">Reading 
        <input type="checkbox" name="hobbies" value="badminton">Badminton 

        <br><br>
        <label for="">Gender</label>
        <input type="radio" name="gender" value="male">Male
        <input type="radio" name="gender" checked value="female">Female
        <input type="radio" name="gender" value="others">Others

        <br><br>
        <label for="">Color : </label>
        <input type="color" value="red">
        <br><br>
        <label for="">File : </label>
        <!-- <input type="file"> -->
        <input type="file" accept=".pdf" multiple>
        <br><br>
        <input type="hidden">

        <br><br>
        <label for="">Country</label>
        <select name="country" id="" size="2" autofocus>
            <option value="india">India</option>
            <option value="USA">USA</option>
            <option value="UK" selected>UK</option>
            <option value="UAE">UAE</option>
        </select>
        <br><br><br>

        <select name="" id="">
            <optgroup label="Fruit">
                <option value="apple">Apple</option>
                <option value="orange">Orange</option>
                <option value="guava">Guava</option>
            </optgroup>

            <optgroup label="Animal">
                <option value="tiger">Tiger</option>
                <option value="lion">Lion</option>
                <option value="cat">Cat</option>
            </optgroup>
        </select>
        <br><br><br>
        <textarea name="" id="" rows="10" cols="25" placeholder="Write Your Message...." maxlength="100" minlength="10"></textarea>
        <br><br><br>

        <label for="">
            Email
            <input type="email">
        </label>

        <br><br><br>
        <fieldset>
            <legend align="right">Address</legend>
            <label for="">City : </label>
            <input type="text">
            <br><br>
            <label for="">State : </label>
            <input type="text">
            <br><br>
            <label for="">Lane : </label>
            <input type="text">
            <br><br>
            <label for="">Country : </label>
            <input type="text">
        </fieldset>
        <input type="image" src="./images/image1.jpeg" width="50" height="50">
    </form>
</body>
</html>
