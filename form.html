<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="firstName">First Name : </label>
        <input type="text" id="firstName" name="firstName" placeholder="First Name" minlength="3" maxlength="10">
        <br><br>        
        <label for="">Last Name : </label>
        <input type="text" name="lastName">
        <br><br>
        <label for="">Email : </label>
        <input type="email" required>
        <br><br>
        <label for="">Password : </label>
        <input type="password">
        <br><br>
        <label for="">Age : </label>
        <input type="number" min="0" max="25" value="15" name="age">
        <br><br>
        <label for="">QTY : </label>
        0<input type="range" min="0" max="10" step="3" value="6">10
        <br><br>
        <label for="">Tel : </label>
        <input type="tel">
        <br><br>
        <label for="">URL : </label>
        <input type="url" required>
        <br><br>
        <label for="">Search : </label>
        <input type="search">

        <br><br>
        <label for="">DOB : </label>
        <input type="date" name="dob" min="2010-01-01" max="2020-12-31">
        <br><br>
        <label for="">Time : </label>
        <input type="time">        
        <br><br>
        <label for="">Date & Time : </label>
        <input type="datetime-local">
        <br><br>
        <label for="">Month : </label>
        <input type="month">
        <br><br>
        <label for="">Week : </label>
        <input type="week">
        <input type="submit" value="Submit">
        <input type="reset">
        <input type="button" value="Subscribe">
    </form>

</body>
</html>
